name: Publish NuGet packages
run-name: Publish NuGet packages ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version already recorded in Version.props
        required: true
        default: "0.8.5"
        type: string

permissions:
  contents: read

concurrency:
  group: publish-packages-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    name: Build, test, pack, and inspect
    runs-on: windows-latest
    outputs:
      tiger-sqlcmd-sha256: ${{ steps.tiger-sqlcmd-hash.outputs.sha256 }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Validate requested version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Invalid release version '$env:RELEASE_VERSION'."
          }

          [xml]$versionProps = Get-Content -Raw Version.props
          $configuredVersion = [string]$versionProps.Project.PropertyGroup.Version
          if ($configuredVersion -ne $env:RELEASE_VERSION) {
            throw "Workflow input '$env:RELEASE_VERSION' does not match Version.props '$configuredVersion'."
          }

      - name: Reject an already-published release version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = "Stop"

          foreach ($id in @(
            "ItTiger.TigerQuery.Core",
            "ItTiger.TigerQuery",
            "ItTiger.TigerQuery.CliCore",
            "ItTiger.TigerSqlCmd"
          )) {
            $lowerId = $id.ToLowerInvariant()
            $index = Invoke-RestMethod "https://api.nuget.org/v3-flatcontainer/$lowerId/index.json"
            if (@($index.versions) -contains ($env:RELEASE_VERSION).ToLowerInvariant()) {
              throw "$id $env:RELEASE_VERSION already exists on NuGet.org. Choose a new version; published packages are immutable."
            }
          }

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore TigerQuery.sln

      - name: Build Release
        run: dotnet build TigerQuery.sln -c Release --no-restore

      - name: Test Release
        run: dotnet test TigerQuery.sln -c Release --no-build

      - name: Build DocFX site
        run: dotnet docfx docs/api-docfx/docfx.json

      - name: Prepare clean package staging directory
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $packageDirectory = [IO.Path]::GetFullPath((Join-Path $PWD "artifacts/packages"))
          $artifactsDirectory = [IO.Path]::GetFullPath((Join-Path $PWD "artifacts"))
          $expectedPrefix = $artifactsDirectory.TrimEnd(
            [IO.Path]::DirectorySeparatorChar,
            [IO.Path]::AltDirectorySeparatorChar
          ) + [IO.Path]::DirectorySeparatorChar
          if (-not $packageDirectory.StartsWith($expectedPrefix, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Refusing to clean package directory outside $artifactsDirectory."
          }
          if (Test-Path -LiteralPath $packageDirectory) {
            Remove-Item -LiteralPath $packageDirectory -Recurse -Force
          }
          New-Item -ItemType Directory -Path $packageDirectory | Out-Null

      - name: Pack ItTiger.TigerQuery.Core
        run: >-
          dotnet pack ItTiger.TigerQuery.Core/ItTiger.TigerQuery.Core.csproj
          -c Release
          --no-build
          --no-restore
          --output artifacts/packages

      - name: Pack ItTiger.TigerQuery
        run: >-
          dotnet pack ItTiger.TigerQuery/ItTiger.TigerQuery.csproj
          -c Release
          --no-build
          --no-restore
          --output artifacts/packages

      - name: Pack ItTiger.TigerQuery.CliCore
        run: >-
          dotnet pack ItTiger.TigerQuery.CliCore/ItTiger.TigerQuery.CliCore.csproj
          -c Release
          --no-build
          --no-restore
          --output artifacts/packages

      - name: Pack ItTiger.TigerSqlCmd
        run: >-
          dotnet pack ItTiger.TigerSqlCmd/ItTiger.TigerSqlCmd.csproj
          -c Release
          --no-build
          --no-restore
          --output artifacts/packages

      - name: Inspect ItTiger.TigerSqlCmd tool package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $id = "ItTiger.TigerSqlCmd"
          $packagePath = "artifacts/packages/$id.$env:RELEASE_VERSION.nupkg"
          $symbolsPath = "artifacts/packages/$id.$env:RELEASE_VERSION.snupkg"
          foreach ($path in @($packagePath, $symbolsPath)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing package: $path"
            }
          }

          $archive = [System.IO.Compression.ZipFile]::OpenRead(
            (Resolve-Path -LiteralPath $packagePath)
          )
          try {
            $nuspecEntry = $archive.GetEntry("$id.nuspec")
            if ($null -eq $nuspecEntry) {
              throw "$packagePath does not contain $id.nuspec."
            }
            $reader = [System.IO.StreamReader]::new($nuspecEntry.Open())
            try {
              [xml]$nuspec = $reader.ReadToEnd()
            }
            finally {
              $reader.Dispose()
            }

            $metadata = $nuspec.SelectSingleNode(
              "/*[local-name()='package']/*[local-name()='metadata']"
            )
            if ([string]$metadata.id -ne $id -or [string]$metadata.version -ne $env:RELEASE_VERSION) {
              throw "$packagePath has unexpected ID or version metadata."
            }
            if ([string]$metadata.readme -ne "README.md" -or $null -eq $archive.GetEntry("README.md")) {
              throw "$packagePath does not contain the configured README.md."
            }
            if ([string]$metadata.icon -ne "TigerQuery256.png" -or $null -eq $archive.GetEntry("TigerQuery256.png")) {
              throw "$packagePath does not contain the configured icon."
            }
            $packageType = $nuspec.SelectSingleNode("//*[local-name()='packageType']")
            if ($null -eq $packageType -or $packageType.GetAttribute("name") -ne "DotnetTool") {
              throw "$packagePath is not marked as a DotnetTool package."
            }
            if (@($nuspec.SelectNodes("//*[local-name()='dependency']")).Count -ne 0) {
              throw "$packagePath must contain its tool payload instead of package dependencies."
            }
            if ($null -eq $archive.GetEntry("tools/net10.0/any/DotnetToolSettings.xml")) {
              throw "$packagePath does not contain DotnetToolSettings.xml."
            }
            if ($null -eq $archive.GetEntry("tools/net10.0/any/tiger-sqlcmd.dll")) {
              throw "$packagePath does not contain the tiger-sqlcmd assembly."
            }
          }
          finally {
            $archive.Dispose()
          }

      - name: Validate exact ItTiger.TigerSqlCmd package structure
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          ./.github/scripts/Assert-TigerSqlCmdToolPackage.ps1 `
            -PackagePath "artifacts/packages/ItTiger.TigerSqlCmd.$env:RELEASE_VERSION.nupkg" `
            -ExpectedVersion $env:RELEASE_VERSION `
            -ExpectedRepositoryCommit $env:GITHUB_SHA

      - name: Validate ItTiger.TigerSqlCmd tool installation
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $toolPath = Join-Path $env:RUNNER_TEMP "tiger-sqlcmd-tool"
          dotnet tool install ItTiger.TigerSqlCmd `
            --tool-path $toolPath `
            --add-source artifacts/packages `
            --version $env:RELEASE_VERSION `
            --ignore-failed-sources
          if ($LASTEXITCODE -ne 0) {
            throw "Tool installation failed with exit code $LASTEXITCODE."
          }
          $versionOutput = & (Join-Path $toolPath "tiger-sqlcmd.exe") --version | Out-String
          if ($LASTEXITCODE -ne 0 -or $versionOutput -notmatch [regex]::Escape($env:RELEASE_VERSION)) {
            throw "Installed tool did not report version $env:RELEASE_VERSION."
          }
          $helpOutput = & (Join-Path $toolPath "tiger-sqlcmd.exe") --help | Out-String
          if ($LASTEXITCODE -ne 0 -or -not $helpOutput.Contains("Usage:")) {
            throw "Installed tool help validation failed."
          }
          dotnet tool uninstall ItTiger.TigerSqlCmd --tool-path $toolPath
          if ($LASTEXITCODE -ne 0) {
            throw "Tool uninstall failed with exit code $LASTEXITCODE."
          }

      - name: Inspect packages
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = "Stop"

          Add-Type -AssemblyName System.IO.Compression.FileSystem

          function Get-PackageReferences {
            param(
              [Parameter(Mandatory)]
              [string]$ProjectPath
            )

            [xml]$project = Get-Content -Raw -LiteralPath $ProjectPath
            $references = @{}
            foreach ($reference in @($project.Project.ItemGroup.PackageReference)) {
              if ($null -eq $reference) {
                continue
              }

              $id = [string]$reference.Include
              $version = [string]$reference.Version
              if ([string]::IsNullOrWhiteSpace($version)) {
                $version = [string]$reference.Version.'#text'
              }

              if ([string]::IsNullOrWhiteSpace($id) -or [string]::IsNullOrWhiteSpace($version)) {
                throw "Could not read a package reference from $ProjectPath."
              }

              $references[$id] = $version
            }

            return $references
          }

          $packages = @(
            @{
              Id = "ItTiger.TigerQuery.Core"
              Project = "ItTiger.TigerQuery.Core/ItTiger.TigerQuery.Core.csproj"
              Icon = "TigerQuery256.png"
            },
            @{
              Id = "ItTiger.TigerQuery"
              Project = "ItTiger.TigerQuery/ItTiger.TigerQuery.csproj"
              Icon = "TigerQuery256.png"
            },
            @{
              Id = "ItTiger.TigerQuery.CliCore"
              Project = "ItTiger.TigerQuery.CliCore/ItTiger.TigerQuery.CliCore.csproj"
              Icon = "TigerQuery256.png"
            }
          )

          foreach ($package in $packages) {
            $id = $package.Id
            $packagePath = "artifacts/packages/$id.$env:RELEASE_VERSION.nupkg"
            $symbolsPath = "artifacts/packages/$id.$env:RELEASE_VERSION.snupkg"

            if (-not (Test-Path -LiteralPath $packagePath -PathType Leaf)) {
              throw "Missing package: $packagePath"
            }
            if (-not (Test-Path -LiteralPath $symbolsPath -PathType Leaf)) {
              throw "Missing symbol package: $symbolsPath"
            }

            $archive = [System.IO.Compression.ZipFile]::OpenRead(
              (Resolve-Path -LiteralPath $packagePath)
            )
            try {
              $nuspecEntry = $archive.GetEntry("$id.nuspec")
              if ($null -eq $nuspecEntry) {
                throw "$packagePath does not contain $id.nuspec."
              }

              $reader = [System.IO.StreamReader]::new($nuspecEntry.Open())
              try {
                [xml]$nuspec = $reader.ReadToEnd()
              }
              finally {
                $reader.Dispose()
              }

              $metadata = $nuspec.SelectSingleNode(
                "/*[local-name()='package']/*[local-name()='metadata']"
              )
              if ([string]$metadata.id -ne $id) {
                throw "$packagePath has package ID '$($metadata.id)', expected '$id'."
              }
              if ([string]$metadata.version -ne $env:RELEASE_VERSION) {
                throw "$packagePath has version '$($metadata.version)', expected '$env:RELEASE_VERSION'."
              }
              if ([string]$metadata.readme -ne "README.md" -or $null -eq $archive.GetEntry("README.md")) {
                throw "$packagePath does not contain the configured root README.md."
              }
              if ([string]$metadata.icon -ne $package.Icon -or $null -eq $archive.GetEntry($package.Icon)) {
                throw "$packagePath does not contain the configured root icon '$($package.Icon)'."
              }
              if ($null -eq $archive.GetEntry("lib/net10.0/$id.dll")) {
                throw "$packagePath does not contain lib/net10.0/$id.dll."
              }
              if ($null -eq $archive.GetEntry("lib/net10.0/$id.xml")) {
                throw "$packagePath does not contain XML documentation at lib/net10.0/$id.xml."
              }

              $repository = $nuspec.SelectSingleNode(
                "/*[local-name()='package']/*[local-name()='metadata']/*[local-name()='repository']"
              )
              if ($null -eq $repository) {
                throw "$packagePath does not contain repository metadata."
              }
              if ($repository.GetAttribute("url") -ne "https://github.com/rkozlowski/TigerQuery") {
                throw "$packagePath has unexpected repository URL '$($repository.GetAttribute("url"))'."
              }
              $repositoryCommit = $repository.GetAttribute("commit")
              if ([string]::IsNullOrWhiteSpace($repositoryCommit)) {
                throw "$packagePath does not contain repository commit metadata."
              }
              if (
                -not [string]::IsNullOrWhiteSpace($env:GITHUB_SHA) -and
                $repositoryCommit -ne $env:GITHUB_SHA
              ) {
                throw "$packagePath has repository commit '$repositoryCommit', expected '$env:GITHUB_SHA'."
              }

              $forbiddenAssemblies = @(
                $archive.Entries |
                  Where-Object {
                    $_.FullName -match '(?i)(TigerSqlCmd|TigerQuery\.Tests).*\.dll$'
                  }
              )
              if ($forbiddenAssemblies.Count -ne 0) {
                throw "$packagePath contains a TigerSqlCmd or test assembly: $($forbiddenAssemblies.FullName -join ', ')."
              }

              $dependencies = @(
                $nuspec.SelectNodes("//*[local-name()='dependency']")
              )
              $forbiddenDependencies = @(
                $dependencies |
                  Where-Object {
                    $_.GetAttribute("id") -match '(?i)NLog|Spectre'
                  }
              )
              if ($forbiddenDependencies.Count -ne 0) {
                throw "$packagePath contains an unexpected NLog or Spectre dependency: $($forbiddenDependencies.id -join ', ')."
              }

              if ($id -eq "ItTiger.TigerQuery") {
                $tigerQueryForbidden = @(
                  $dependencies |
                    Where-Object {
                      $_.GetAttribute("id") -match '(?i)TigerCli|TigerQuery\.CliCore|NLog|Spectre'
                    }
                )
                if ($tigerQueryForbidden.Count -ne 0) {
                  throw "$packagePath contains a forbidden dependency: $($tigerQueryForbidden.id -join ', ')."
                }
              }

              $expectedDependencies = Get-PackageReferences -ProjectPath $package.Project
              if ($id -in @("ItTiger.TigerQuery", "ItTiger.TigerQuery.CliCore")) {
                $expectedDependencies["ItTiger.TigerQuery.Core"] = $env:RELEASE_VERSION
              }

              if ($dependencies.Count -ne $expectedDependencies.Count) {
                throw "$packagePath has $($dependencies.Count) dependencies; expected $($expectedDependencies.Count)."
              }

              foreach ($expectedDependency in $expectedDependencies.GetEnumerator()) {
                $matches = @(
                  $dependencies |
                    Where-Object {
                      $_.GetAttribute("id") -eq $expectedDependency.Key
                    }
                )
                if ($matches.Count -ne 1) {
                  throw "$packagePath must contain exactly one '$($expectedDependency.Key)' dependency."
                }
                if ($matches[0].GetAttribute("version") -ne $expectedDependency.Value) {
                  throw "$packagePath depends on '$($expectedDependency.Key)' version '$($matches[0].GetAttribute("version"))', expected '$($expectedDependency.Value)'."
                }
              }

              if ($id -eq "ItTiger.TigerQuery.CliCore") {
                $coreDependency = @(
                  $dependencies |
                    Where-Object {
                      $_.GetAttribute("id") -eq "ItTiger.TigerQuery.Core"
                    }
                )
                if ($coreDependency.Count -ne 1) {
                  throw "$packagePath must contain exactly one ItTiger.TigerQuery.Core dependency."
                }
                if ($coreDependency[0].GetAttribute("version") -ne $env:RELEASE_VERSION) {
                  throw "$packagePath depends on ItTiger.TigerQuery.Core '$($coreDependency[0].GetAttribute("version"))', expected '$env:RELEASE_VERSION'."
                }

                $tigerCliDependency = @(
                  $dependencies |
                    Where-Object {
                      $_.GetAttribute("id") -eq "ItTiger.TigerCli"
                    }
                )
                $configuredTigerCliVersion = $expectedDependencies["ItTiger.TigerCli"]
                if ($tigerCliDependency.Count -ne 1) {
                  throw "$packagePath must contain exactly one ItTiger.TigerCli dependency."
                }
                if ($tigerCliDependency[0].GetAttribute("version") -ne $configuredTigerCliVersion) {
                  throw "$packagePath depends on ItTiger.TigerCli '$($tigerCliDependency[0].GetAttribute("version"))', expected configured version '$configuredTigerCliVersion'."
                }
              }
            }
            finally {
              $archive.Dispose()
            }

            Write-Host "Validated $packagePath and $symbolsPath"
          }

      - name: Record exact validated ItTiger.TigerSqlCmd package hash
        id: tiger-sqlcmd-hash
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $packagePath = "artifacts/packages/ItTiger.TigerSqlCmd.$env:RELEASE_VERSION.nupkg"
          $hash = (Get-FileHash -LiteralPath $packagePath -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content `
            -LiteralPath "$packagePath.sha256" `
            -Value "$hash  $([IO.Path]::GetFileName($packagePath))" `
            -Encoding utf8NoBOM
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Approved package candidate SHA-256: $hash"

      - name: Upload validated packages
        uses: actions/upload-artifact@v7
        with:
          name: NuGet-packages-${{ inputs.version }}
          path: |
            artifacts/packages/ItTiger.TigerQuery.Core.${{ inputs.version }}.nupkg
            artifacts/packages/ItTiger.TigerQuery.Core.${{ inputs.version }}.snupkg
            artifacts/packages/ItTiger.TigerQuery.${{ inputs.version }}.nupkg
            artifacts/packages/ItTiger.TigerQuery.${{ inputs.version }}.snupkg
            artifacts/packages/ItTiger.TigerQuery.CliCore.${{ inputs.version }}.nupkg
            artifacts/packages/ItTiger.TigerQuery.CliCore.${{ inputs.version }}.snupkg
            artifacts/packages/ItTiger.TigerSqlCmd.${{ inputs.version }}.nupkg
            artifacts/packages/ItTiger.TigerSqlCmd.${{ inputs.version }}.snupkg
            artifacts/packages/ItTiger.TigerSqlCmd.${{ inputs.version }}.nupkg.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Approve and publish
    needs: validate
    runs-on: windows-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout validation script
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Download validated packages
        uses: actions/download-artifact@v7
        with:
          name: NuGet-packages-${{ inputs.version }}
          path: artifacts/packages

      - name: Verify approved package bytes and tool structure
        shell: pwsh
        env:
          EXPECTED_TIGER_SQLCMD_SHA256: ${{ needs.validate.outputs.tiger-sqlcmd-sha256 }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $packagePath = "artifacts/packages/ItTiger.TigerSqlCmd.$env:RELEASE_VERSION.nupkg"
          $hashPath = "$packagePath.sha256"

          $actualHash = (Get-FileHash -LiteralPath $packagePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $recordedHashLine = (Get-Content -LiteralPath $hashPath -Raw).Trim()
          $expectedHashLine = "$env:EXPECTED_TIGER_SQLCMD_SHA256  $([IO.Path]::GetFileName($packagePath))"
          if ($actualHash -cne $env:EXPECTED_TIGER_SQLCMD_SHA256 -or $recordedHashLine -cne $expectedHashLine) {
            throw "Downloaded tool package SHA-256 '$actualHash' does not match the pre-approval hash '$env:EXPECTED_TIGER_SQLCMD_SHA256'."
          }

          ./.github/scripts/Assert-TigerSqlCmdToolPackage.ps1 `
            -PackagePath $packagePath `
            -ExpectedVersion $env:RELEASE_VERSION `
            -ExpectedRepositoryCommit $env:GITHUB_SHA

      - name: Verify NuGet.org Trusted Publishing configuration
        shell: pwsh
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_USER)) {
            Write-Error "Set the NUGET_USER repository variable to the nuget.org profile username used by the Trusted Publishing policy."
            exit 1
          }
          # NuGet.org Trusted Publishing is configured for package owner ItTiger,
          # repository owner rkozlowski, repository TigerQuery, workflow
          # publish-packages.yml, and environment release.

      - name: Get short-lived NuGet.org API key
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish ItTiger.TigerQuery.Core to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          dotnet nuget push "artifacts/packages/ItTiger.TigerQuery.Core.$env:RELEASE_VERSION.nupkg" `
            --source https://api.nuget.org/v3/index.json `
            --api-key "$env:NUGET_API_KEY" `
            --skip-duplicate `
            --no-symbols
          dotnet nuget push "artifacts/packages/ItTiger.TigerQuery.Core.$env:RELEASE_VERSION.snupkg" `
            --source https://api.nuget.org/v3/index.json `
            --api-key "$env:NUGET_API_KEY" `
            --skip-duplicate

      - name: Publish ItTiger.TigerQuery to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          dotnet nuget push "artifacts/packages/ItTiger.TigerQuery.$env:RELEASE_VERSION.nupkg" `
            --source https://api.nuget.org/v3/index.json `
            --api-key "$env:NUGET_API_KEY" `
            --skip-duplicate `
            --no-symbols
          dotnet nuget push "artifacts/packages/ItTiger.TigerQuery.$env:RELEASE_VERSION.snupkg" `
            --source https://api.nuget.org/v3/index.json `
            --api-key "$env:NUGET_API_KEY" `
            --skip-duplicate

      - name: Publish ItTiger.TigerQuery.CliCore to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          dotnet nuget push "artifacts/packages/ItTiger.TigerQuery.CliCore.$env:RELEASE_VERSION.nupkg" `
            --source https://api.nuget.org/v3/index.json `
            --api-key "$env:NUGET_API_KEY" `
            --skip-duplicate `
            --no-symbols
          dotnet nuget push "artifacts/packages/ItTiger.TigerQuery.CliCore.$env:RELEASE_VERSION.snupkg" `
            --source https://api.nuget.org/v3/index.json `
            --api-key "$env:NUGET_API_KEY" `
            --skip-duplicate

      - name: Publish ItTiger.TigerSqlCmd to NuGet.org
        shell: pwsh
        env:
          EXPECTED_TIGER_SQLCMD_SHA256: ${{ needs.validate.outputs.tiger-sqlcmd-sha256 }}
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $packagePath = "artifacts/packages/ItTiger.TigerSqlCmd.$env:RELEASE_VERSION.nupkg"
          $actualHash = (Get-FileHash -LiteralPath $packagePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -cne $env:EXPECTED_TIGER_SQLCMD_SHA256) {
            throw "Refusing to publish tool package SHA-256 '$actualHash'; approved SHA-256 is '$env:EXPECTED_TIGER_SQLCMD_SHA256'."
          }
          dotnet nuget push $packagePath `
            --source https://api.nuget.org/v3/index.json `
            --api-key "$env:NUGET_API_KEY" `
            --skip-duplicate `
            --no-symbols
          dotnet nuget push "artifacts/packages/ItTiger.TigerSqlCmd.$env:RELEASE_VERSION.snupkg" `
            --source https://api.nuget.org/v3/index.json `
            --api-key "$env:NUGET_API_KEY" `
            --skip-duplicate
