name: Release TigerQuery
run-name: Release TigerQuery ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version already recorded in Version.props
        required: true
        type: string
        default: '0.8.8'

permissions:
  contents: read

concurrency:
  group: release-tigerquery-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    name: Build and validate exact release artifacts
    runs-on: windows-latest
    outputs:
      manifest-sha256: ${{ steps.manifest-hash.outputs.sha256 }}
    permissions:
      contents: read
    steps:
      - name: Check out the dispatched commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify release commit, version, and tag availability
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ($env:GITHUB_REF -cne 'refs/heads/main') {
            throw "Releases must be dispatched from main; this run uses '$env:GITHUB_REF'."
          }
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Invalid release version '$env:RELEASE_VERSION'."
          }

          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:GITHUB_SHA) {
            throw "Checked-out commit '$head' does not match workflow commit '$env:GITHUB_SHA'."
          }
          if (git status --porcelain) {
            throw 'Release checkout is not clean.'
          }

          [xml] $versionProps = Get-Content -Raw -LiteralPath Version.props
          $configuredVersion = [string] $versionProps.Project.PropertyGroup.Version
          if ($configuredVersion -cne $env:RELEASE_VERSION) {
            throw "Workflow input '$env:RELEASE_VERSION' does not match Version.props '$configuredVersion'."
          }

          $tag = "v$env:RELEASE_VERSION"
          $remoteTag = (git ls-remote --tags origin "refs/tags/$tag" | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect remote tag $tag." }
          if (-not [string]::IsNullOrWhiteSpace($remoteTag)) {
            git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw "Could not fetch existing tag $tag." }
            $tagCommit = (git rev-list -n 1 $tag).Trim()
            if ($tagCommit -cne $env:GITHUB_SHA) {
              throw "Tag $tag points to '$tagCommit', not '$env:GITHUB_SHA'. It will never be moved."
            }
            throw "Tag $tag already exists at the requested commit. This fresh-release workflow will not overwrite or silently resume publication; follow the documented recovery procedure."
          }

      - name: Reject an already-published NuGet version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: ./eng/release-automation/Assert-NuGetVersionAvailable.ps1 -Version $env:RELEASE_VERSION

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore TigerQuery.sln

      - name: Prepare clean release staging
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactsRoot = [IO.Path]::GetFullPath((Join-Path $PWD 'artifacts'))
          $repositoryRoot = [IO.Path]::GetFullPath($PWD)
          $requiredPrefix = $repositoryRoot.TrimEnd('\', '/') + [IO.Path]::DirectorySeparatorChar
          if (-not $artifactsRoot.StartsWith($requiredPrefix, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Refusing to clean staging outside $repositoryRoot."
          }
          if (Test-Path -LiteralPath $artifactsRoot) {
            Remove-Item -LiteralPath $artifactsRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Path (Join-Path $artifactsRoot 'release') -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $artifactsRoot 'winget') -Force | Out-Null

      - name: Build Release
        run: >-
          dotnet build TigerQuery.sln
          -c Release
          --no-restore
          -p:ContinuousIntegrationBuild=true
          -m:1
          /nodeReuse:false

      - name: Validate live-test safety when unconfigured
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $store = Join-Path $env:RUNNER_TEMP (Join-Path ('TigerQuery-live-safe-' + [Guid]::NewGuid().ToString('N')) 'connections.json')
          $env:TIGERQUERY_CONNECTION_STORE_FILE = $store
          try {
            dotnet test ItTiger.TigerQuery.Tests/ItTiger.TigerQuery.Tests.csproj `
              -c Release `
              --filter 'FullyQualifiedName~ItTiger.TigerQuery.Tests.Live' `
              --no-restore `
              --no-build `
              --logger 'console;verbosity=normal' `
              -m:1 `
              /nodeReuse:false
            $testExit = $LASTEXITCODE
            $storeCreated = Test-Path -LiteralPath $store
          }
          finally {
            Remove-Item Env:TIGERQUERY_CONNECTION_STORE_FILE -ErrorAction Ignore
          }
          if ($testExit -ne 0) { throw "Live-safe validation failed with exit code $testExit." }
          if ($storeCreated) { throw "Unconfigured live tests created a connection store: $store" }

      - name: Test Release against an unconfigured store
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $store = Join-Path $env:RUNNER_TEMP (Join-Path ('TigerQuery-unconfigured-' + [Guid]::NewGuid().ToString('N')) 'connections.json')
          $env:TIGERQUERY_CONNECTION_STORE_FILE = $store
          try {
            dotnet test TigerQuery.sln `
              -c Release `
              --no-restore `
              --no-build `
              --logger 'console;verbosity=normal' `
              -m:1 `
              /nodeReuse:false
            $testExit = $LASTEXITCODE
            $storeCreated = Test-Path -LiteralPath $store
          }
          finally {
            Remove-Item Env:TIGERQUERY_CONNECTION_STORE_FILE -ErrorAction Ignore
          }
          if ($testExit -ne 0) { throw "Release tests failed with exit code $testExit." }
          if ($storeCreated) { throw "Unconfigured tests created a connection store: $store" }

      - name: Build DocFX site
        run: dotnet docfx docs/api-docfx/docfx.json

      - name: Pack ItTiger.TigerQuery.Core
        run: >-
          dotnet pack ItTiger.TigerQuery.Core/ItTiger.TigerQuery.Core.csproj
          -c Release --no-build --no-restore
          -p:ContinuousIntegrationBuild=true
          -p:RepositoryCommit=${{ github.sha }}
          --output artifacts/release

      - name: Pack ItTiger.TigerQuery
        run: >-
          dotnet pack ItTiger.TigerQuery/ItTiger.TigerQuery.csproj
          -c Release --no-build --no-restore
          -p:ContinuousIntegrationBuild=true
          -p:RepositoryCommit=${{ github.sha }}
          --output artifacts/release

      - name: Pack ItTiger.TigerQuery.CliCore
        run: >-
          dotnet pack ItTiger.TigerQuery.CliCore/ItTiger.TigerQuery.CliCore.csproj
          -c Release --no-build --no-restore
          -p:ContinuousIntegrationBuild=true
          -p:RepositoryCommit=${{ github.sha }}
          --output artifacts/release

      - name: Pack ItTiger.TigerSqlCmd
        run: >-
          dotnet pack ItTiger.TigerSqlCmd/ItTiger.TigerSqlCmd.csproj
          -c Release --no-build --no-restore
          -p:ContinuousIntegrationBuild=true
          -p:RepositoryCommit=${{ github.sha }}
          --output artifacts/release

      - name: Inspect library packages
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          ./eng/release-automation/Assert-TigerQueryLibraryPackages.ps1 `
            -PackageDirectory artifacts/release `
            -ExpectedVersion $env:RELEASE_VERSION `
            -ExpectedRepositoryCommit $env:GITHUB_SHA

      - name: Inspect TigerSqlCmd .NET tool package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          ./.github/scripts/Assert-TigerSqlCmdToolPackage.ps1 `
            -PackagePath "artifacts/release/ItTiger.TigerSqlCmd.$env:RELEASE_VERSION.nupkg" `
            -ExpectedVersion $env:RELEASE_VERSION `
            -ExpectedRepositoryCommit $env:GITHUB_SHA

      - name: Inspect all symbol packages
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          ./eng/release-automation/Assert-ReleaseSymbolPackages.ps1 `
            -PackageDirectory artifacts/release `
            -ExpectedVersion $env:RELEASE_VERSION `
            -ExpectedRepositoryCommit $env:GITHUB_SHA

      - name: Validate TigerSqlCmd tool installation
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $toolPath = Join-Path $env:RUNNER_TEMP 'tiger-sqlcmd-tool'
          dotnet tool install ItTiger.TigerSqlCmd --tool-path $toolPath --add-source artifacts/release --version $env:RELEASE_VERSION --ignore-failed-sources
          if ($LASTEXITCODE -ne 0) { throw "Tool installation failed with exit code $LASTEXITCODE." }
          $versionOutput = & (Join-Path $toolPath 'tiger-sqlcmd.exe') --version | Out-String
          if ($LASTEXITCODE -ne 0 -or $versionOutput -notmatch [regex]::Escape($env:RELEASE_VERSION)) { throw 'Installed tool version validation failed.' }
          $helpOutput = & (Join-Path $toolPath 'tiger-sqlcmd.exe') --help | Out-String
          if ($LASTEXITCODE -ne 0 -or -not $helpOutput.Contains('Usage:')) { throw 'Installed tool help validation failed.' }
          dotnet tool uninstall ItTiger.TigerSqlCmd --tool-path $toolPath
          if ($LASTEXITCODE -ne 0) { throw "Tool uninstall failed with exit code $LASTEXITCODE." }

      - name: Provision pinned Inno Setup
        shell: pwsh
        env:
          INNO_SETUP_VERSION: '7.1.0'
          INNO_SETUP_INSTALLER_URI: 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe'
          INNO_SETUP_INSTALLER_SHA256: '0362A383ED217D4C4239B5933866DD96D3EB2102737DA92F80F6057A4B40DF2F'
        run: |
          $ErrorActionPreference = 'Stop'
          $compilerPath = ./eng/release-automation/Install-InnoSetup.ps1 `
            -Version $env:INNO_SETUP_VERSION `
            -InstallerUri $env:INNO_SETUP_INSTALLER_URI `
            -InstallerSha256 $env:INNO_SETUP_INSTALLER_SHA256
          if ([string]::IsNullOrWhiteSpace($compilerPath) -or
              -not (Test-Path -LiteralPath $compilerPath -PathType Leaf)) {
            throw "Inno Setup $env:INNO_SETUP_VERSION provisioning did not resolve an existing ISCC.exe path: '$compilerPath'."
          }
          "INNO_SETUP_COMPILER=$compilerPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build TigerSqlCmd installer from validated outputs
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:INNO_SETUP_COMPILER) -or
              -not (Test-Path -LiteralPath $env:INNO_SETUP_COMPILER -PathType Leaf)) {
            throw "The provisioned Inno Setup compiler is unavailable at '$env:INNO_SETUP_COMPILER'."
          }
          ./ItTiger.TigerSqlCmd.Installer/BuildInstaller.ps1 `
            -ExpectedVersion $env:RELEASE_VERSION `
            -OutputDirectory artifacts/release `
            -InnoSetupCompilerPath $env:INNO_SETUP_COMPILER `
            -NoBuild

      - name: Validate TigerSqlCmd installer metadata and behavior
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $installer = "artifacts/release/TigerSqlCmdSetup_$($env:RELEASE_VERSION -replace '\.', '_').exe"
          ./eng/release-automation/Assert-TigerSqlCmdInstaller.ps1 -InstallerPath $installer -ExpectedVersion $env:RELEASE_VERSION -ValidateBehavior

      - name: Record exact release payload hashes
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          ./eng/release-automation/New-ReleaseArtifactManifest.ps1 `
            -ArtifactDirectory artifacts/release `
            -Version $env:RELEASE_VERSION `
            -CommitSha $env:GITHUB_SHA

      - name: Install WinGet for manifest validation
        shell: pwsh
        env:
          WINGET_CLIENT_MODULE_VERSION: '1.29.280'
        run: |
          $ErrorActionPreference = 'Stop'

          function Resolve-WorkingWinGet {
            $candidate = Get-Command winget.exe -CommandType Application -ErrorAction SilentlyContinue
            if ($null -eq $candidate -or -not (Test-Path -LiteralPath $candidate.Source -PathType Leaf)) {
              return $null
            }
            & $candidate.Source --info | Out-Host
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "The discovered winget.exe at '$($candidate.Source)' exited with code $LASTEXITCODE."
              return $null
            }
            return $candidate
          }

          $winget = Resolve-WorkingWinGet
          if ($null -eq $winget) {
            if ($null -eq (Get-Command Install-Module -ErrorAction SilentlyContinue)) {
              throw 'WinGet is absent or unusable and Install-Module is unavailable, so Microsoft.WinGet.Client cannot repair it.'
            }
            Install-Module Microsoft.WinGet.Client `
              -RequiredVersion $env:WINGET_CLIENT_MODULE_VERSION `
              -Repository PSGallery `
              -Scope CurrentUser `
              -Force
            Import-Module Microsoft.WinGet.Client -RequiredVersion $env:WINGET_CLIENT_MODULE_VERSION
            if ($null -eq (Get-Command Repair-WinGetPackageManager -ErrorAction SilentlyContinue)) {
              throw "Microsoft.WinGet.Client $env:WINGET_CLIENT_MODULE_VERSION did not expose Repair-WinGetPackageManager."
            }
            Repair-WinGetPackageManager -AllUsers
            $winget = Resolve-WorkingWinGet
          }
          if ($null -eq $winget) {
            throw 'WinGet provisioning completed without resolving an executable winget.exe.'
          }
          Write-Host "Using WinGet at '$($winget.Source)'."

      - name: Generate and validate WinGet manifests
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $installer = "artifacts/release/TigerSqlCmdSetup_$($env:RELEASE_VERSION -replace '\.', '_').exe"
          $installerHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
          $installerUrl = "https://github.com/rkozlowski/TigerQuery/releases/download/v$env:RELEASE_VERSION/$([IO.Path]::GetFileName($installer))"
          ./eng/winget/Prepare-TigerSqlCmdWinGet.ps1 `
            -InstallerPath $installer `
            -OutputRoot artifacts/winget `
            -ExpectedVersion $env:RELEASE_VERSION `
            -InstallerUrl $installerUrl `
            -ExpectedInstallerSha256 $installerHash `
            -Validate

      - name: Verify final release artifact set
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          ./eng/release-automation/Assert-ReleaseArtifactManifest.ps1 `
            -ArtifactDirectory artifacts/release `
            -ManifestPath artifacts/release/release-artifacts.json `
            -ExpectedVersion $env:RELEASE_VERSION `
            -ExpectedCommit $env:GITHUB_SHA

      - name: Verify release construction did not mutate committed inputs
        shell: pwsh
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) {
            throw 'Release construction changed tracked files. Commit generated inputs before releasing.'
          }

      - name: Record release transfer metadata
        id: manifest-hash
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $hash = (Get-FileHash -LiteralPath artifacts/release/release-artifacts.json -Algorithm SHA256).Hash.ToLowerInvariant()
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $installerPath = "artifacts/release/TigerSqlCmdSetup_$($env:RELEASE_VERSION -replace '\.', '_').exe"
          "installer_path=$installerPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Release manifest transfer SHA-256: $hash"

      - name: Upload exact validated release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: TigerQuery-release-${{ inputs.version }}-${{ github.sha }}
          path: |
            artifacts/release/ItTiger.TigerQuery.${{ inputs.version }}.nupkg
            artifacts/release/ItTiger.TigerQuery.${{ inputs.version }}.snupkg
            artifacts/release/ItTiger.TigerQuery.Core.${{ inputs.version }}.nupkg
            artifacts/release/ItTiger.TigerQuery.Core.${{ inputs.version }}.snupkg
            artifacts/release/ItTiger.TigerQuery.CliCore.${{ inputs.version }}.nupkg
            artifacts/release/ItTiger.TigerQuery.CliCore.${{ inputs.version }}.snupkg
            artifacts/release/ItTiger.TigerSqlCmd.${{ inputs.version }}.nupkg
            artifacts/release/ItTiger.TigerSqlCmd.${{ inputs.version }}.snupkg
            ${{ steps.manifest-hash.outputs.installer_path }}
            artifacts/release/release-artifacts.json
            artifacts/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload prepared WinGet manifests
        uses: actions/upload-artifact@v7
        with:
          name: TigerSqlCmd-WinGet-${{ inputs.version }}-${{ github.sha }}
          path: |
            artifacts/winget/manifests/i/ItTiger/TigerSqlCmd/${{ inputs.version }}/ItTiger.TigerSqlCmd.installer.yaml
            artifacts/winget/manifests/i/ItTiger/TigerSqlCmd/${{ inputs.version }}/ItTiger.TigerSqlCmd.locale.en-US.yaml
            artifacts/winget/manifests/i/ItTiger/TigerSqlCmd/${{ inputs.version }}/ItTiger.TigerSqlCmd.yaml
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish validated bytes and create draft release
    needs: validate
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out the validated commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Verify publication runner tools before publishing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($commandName in @('dotnet.exe', 'git.exe', 'gh.exe')) {
            $command = Get-Command $commandName -CommandType Application -ErrorAction SilentlyContinue
            if ($null -eq $command -or -not (Test-Path -LiteralPath $command.Source -PathType Leaf)) {
              throw "Required publication command '$commandName' is unavailable on the hosted runner."
            }
            Write-Host "$commandName => $($command.Source)"
          }
          dotnet --version
          if ($LASTEXITCODE -ne 0) { throw 'The configured .NET SDK is not executable.' }
          gh --version
          if ($LASTEXITCODE -ne 0) { throw 'GitHub CLI is not executable.' }

      - name: Download validated release artifacts
        uses: actions/download-artifact@v7
        with:
          name: TigerQuery-release-${{ inputs.version }}-${{ github.sha }}
          path: artifacts/release

      - name: Verify artifact transfer and exact payload bytes
        shell: pwsh
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.validate.outputs.manifest-sha256 }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $actualManifestHash = (Get-FileHash -LiteralPath artifacts/release/release-artifacts.json -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualManifestHash -cne $env:EXPECTED_MANIFEST_SHA256) {
            throw "Transferred manifest SHA-256 '$actualManifestHash' does not match '$env:EXPECTED_MANIFEST_SHA256'."
          }
          ./eng/release-automation/Assert-ReleaseArtifactManifest.ps1 -ArtifactDirectory artifacts/release -ManifestPath artifacts/release/release-artifacts.json -ExpectedVersion $env:RELEASE_VERSION -ExpectedCommit $env:GITHUB_SHA

      - name: Recheck NuGet version availability at publication boundary
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: ./eng/release-automation/Assert-NuGetVersionAvailable.ps1 -Version $env:RELEASE_VERSION

      - name: Verify NuGet.org Trusted Publishing configuration
        shell: pwsh
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_USER)) {
            throw 'Set NUGET_USER to the nuget.org profile username used by the Trusted Publishing policy.'
          }
          # Trusted Publishing is bound to rkozlowski/TigerQuery,
          # publish-packages.yml, and environment release. Keep this filename stable.

      - name: Get short-lived NuGet.org API key
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish ItTiger.TigerQuery.Core exact bytes
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          ./eng/release-automation/Assert-ReleaseArtifactManifest.ps1 -ArtifactDirectory artifacts/release -ManifestPath artifacts/release/release-artifacts.json -ExpectedVersion $env:RELEASE_VERSION -ExpectedCommit $env:GITHUB_SHA
          dotnet nuget push "artifacts/release/ItTiger.TigerQuery.Core.$env:RELEASE_VERSION.nupkg" --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY --no-symbols
          if ($LASTEXITCODE -ne 0) { throw 'ItTiger.TigerQuery.Core package publication failed.' }
          ./eng/release-automation/Assert-ReleaseArtifactManifest.ps1 -ArtifactDirectory artifacts/release -ManifestPath artifacts/release/release-artifacts.json -ExpectedVersion $env:RELEASE_VERSION -ExpectedCommit $env:GITHUB_SHA
          dotnet nuget push "artifacts/release/ItTiger.TigerQuery.Core.$env:RELEASE_VERSION.snupkg" --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY
          if ($LASTEXITCODE -ne 0) { throw 'ItTiger.TigerQuery.Core symbols publication failed.' }

      - name: Publish ItTiger.TigerQuery exact bytes
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          ./eng/release-automation/Assert-ReleaseArtifactManifest.ps1 -ArtifactDirectory artifacts/release -ManifestPath artifacts/release/release-artifacts.json -ExpectedVersion $env:RELEASE_VERSION -ExpectedCommit $env:GITHUB_SHA
          dotnet nuget push "artifacts/release/ItTiger.TigerQuery.$env:RELEASE_VERSION.nupkg" --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY --no-symbols
          if ($LASTEXITCODE -ne 0) { throw 'ItTiger.TigerQuery package publication failed.' }
          ./eng/release-automation/Assert-ReleaseArtifactManifest.ps1 -ArtifactDirectory artifacts/release -ManifestPath artifacts/release/release-artifacts.json -ExpectedVersion $env:RELEASE_VERSION -ExpectedCommit $env:GITHUB_SHA
          dotnet nuget push "artifacts/release/ItTiger.TigerQuery.$env:RELEASE_VERSION.snupkg" --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY
          if ($LASTEXITCODE -ne 0) { throw 'ItTiger.TigerQuery symbols publication failed.' }

      - name: Publish ItTiger.TigerQuery.CliCore exact bytes
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          ./eng/release-automation/Assert-ReleaseArtifactManifest.ps1 -ArtifactDirectory artifacts/release -ManifestPath artifacts/release/release-artifacts.json -ExpectedVersion $env:RELEASE_VERSION -ExpectedCommit $env:GITHUB_SHA
          dotnet nuget push "artifacts/release/ItTiger.TigerQuery.CliCore.$env:RELEASE_VERSION.nupkg" --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY --no-symbols
          if ($LASTEXITCODE -ne 0) { throw 'ItTiger.TigerQuery.CliCore package publication failed.' }
          ./eng/release-automation/Assert-ReleaseArtifactManifest.ps1 -ArtifactDirectory artifacts/release -ManifestPath artifacts/release/release-artifacts.json -ExpectedVersion $env:RELEASE_VERSION -ExpectedCommit $env:GITHUB_SHA
          dotnet nuget push "artifacts/release/ItTiger.TigerQuery.CliCore.$env:RELEASE_VERSION.snupkg" --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY
          if ($LASTEXITCODE -ne 0) { throw 'ItTiger.TigerQuery.CliCore symbols publication failed.' }

      - name: Publish ItTiger.TigerSqlCmd exact bytes
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          ./eng/release-automation/Assert-ReleaseArtifactManifest.ps1 -ArtifactDirectory artifacts/release -ManifestPath artifacts/release/release-artifacts.json -ExpectedVersion $env:RELEASE_VERSION -ExpectedCommit $env:GITHUB_SHA
          ./.github/scripts/Assert-TigerSqlCmdToolPackage.ps1 -PackagePath "artifacts/release/ItTiger.TigerSqlCmd.$env:RELEASE_VERSION.nupkg" -ExpectedVersion $env:RELEASE_VERSION -ExpectedRepositoryCommit $env:GITHUB_SHA
          dotnet nuget push "artifacts/release/ItTiger.TigerSqlCmd.$env:RELEASE_VERSION.nupkg" --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY --no-symbols
          if ($LASTEXITCODE -ne 0) { throw 'ItTiger.TigerSqlCmd package publication failed.' }
          ./eng/release-automation/Assert-ReleaseArtifactManifest.ps1 -ArtifactDirectory artifacts/release -ManifestPath artifacts/release/release-artifacts.json -ExpectedVersion $env:RELEASE_VERSION -ExpectedCommit $env:GITHUB_SHA
          dotnet nuget push "artifacts/release/ItTiger.TigerSqlCmd.$env:RELEASE_VERSION.snupkg" --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY
