name: Publish API documentation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-docs.yml"
      - ".config/dotnet-tools.json"
      - "TigerQuery.sln"
      - "Version.props"
      - "docs/**"
      - "ItTiger.TigerQuery/**"
      - "ItTiger.TigerQuery.Core/**"
      - "ItTiger.TigerQuery.CliCore/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore TigerQuery.sln

      - name: Build
        run: dotnet build TigerQuery.sln --configuration Release --no-restore

      - name: Build DocFX site
        run: dotnet docfx docs/api-docfx/docfx.json

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/api-docfx/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
